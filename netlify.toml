# Netlify build settings. Netlify reads this automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets never change, so cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The portfolio moved back to /work (Terracotta Rose redesign, Oct 2026).
# Old /projects links keep working. Renamed case studies go to their new
# slugs; projects that are no longer published go to the Work page.
[[redirects]]
  from = "/projects/nsc-wheel-design/"
  to = "/work/negative-split/"
  status = 301

[[redirects]]
  from = "/projects/wings-for-life-team-logo/"
  to = "/work/wings-for-life/"
  status = 301

[[redirects]]
  from = "/projects/flavours-of-plenty/"
  to = "/work/flavours-of-plenty/"
  status = 301

[[redirects]]
  from = "/projects/ride-retreat/"
  to = "/work/ride-retreat/"
  status = 301

[[redirects]]
  from = "/projects/empty-plate-club/"
  to = "/work/empty-plate-club/"
  status = 301

[[redirects]]
  from = "/projects/rotorua-walking-tours/"
  to = "/work/rotorua-walking-tours/"
  status = 301

[[redirects]]
  from = "/projects/run-for-reido/"
  to = "/work/run-for-reido/"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/work/"
  status = 301

# The Approach page was folded into Services.
[[redirects]]
  from = "/approach/*"
  to = "/services/"
  status = 301

# Send www and the default Netlify address to the main domain.
[[redirects]]
  from = "https://www.theoutsidein.nz/*"
  to = "https://theoutsidein.nz/:splat"
  status = 301
  force = true
