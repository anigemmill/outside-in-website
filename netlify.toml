# Netlify build settings. Netlify reads this automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets never change, so cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /work was renamed to /projects. Old links keep working.
[[redirects]]
  from = "/work"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "/work/*"
  to = "/projects/:splat"
  status = 301

# Send www and the default Netlify address to the main domain.
[[redirects]]
  from = "https://www.theoutsidein.nz/*"
  to = "https://theoutsidein.nz/:splat"
  status = 301
  force = true
